<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ABK Game</title>

<style>

/* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


/* =========================
   BODY
========================= */

html,
body{

    width:100%;
    height:100%;

    overflow:hidden;

    font-family:Arial,sans-serif;

    background:#080a12;

    color:#fff;
}


/* =========================
   MAIN DASHBOARD
========================= */

#mainDashboard{

    position:fixed;

    inset:0;

    width:100%;
    height:100%;

    padding:18px;

    overflow:auto;

    background:

        radial-gradient(
            circle at top right,
            #27315d 0%,
            transparent 35%
        ),

        linear-gradient(
            135deg,
            #080a12,
            #11162b,
            #080a12
        );
}


/* =========================
   TOP HEADER BOX
========================= */

.top-header-box{

    position:relative;

    width:92%;
    max-width:700px;

    height:58px;

    margin:0 auto;

    padding:0 10px 0 18px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    border-radius:17px;

    background:
        linear-gradient(
            145deg,
            #ffffff14,
            #ffffff06
        );

    border:1px solid #ffffff20;

    box-shadow:
        0 8px 30px #0005;

    backdrop-filter:blur(14px);

    -webkit-backdrop-filter:blur(14px);

    overflow:hidden;
}


/* =========================
   HEADER LEFT (LOGO + CREDIT)
========================= */

.header-left{

    display:flex;

    align-items:center;

    gap:8px;

    min-width:0;
}


/* =========================
   LOGO
========================= */

.top-header-box .logo{

    font-size:22px;

    font-weight:800;

    letter-spacing:.3px;

    white-space:nowrap;
}


/* =========================
   DEVELOPER CREDIT
========================= */

.developer-credit{

    font-size:12px;

    font-weight:700;

    color:#ffffff;

    text-decoration:none;

    white-space:nowrap;

    letter-spacing:.3px;

    padding:4px 9px;

    border-radius:8px;

    background:#512DA8;

    border:1px solid #ffffff35;
}


.developer-credit:hover{

    opacity:.85;
}


/* =========================
   HEADER RIGHT
========================= */

.header-right{

    display:flex;

    align-items:center;

    gap:7px;

    flex-shrink:0;
}


/* =========================
   TELEGRAM BUTTON
========================= */

.telegram-btn{

    width:36px;
    height:36px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:11px;

    background:#168de2;

    border:1px solid #ffffff25;

    color:#fff;

    text-decoration:none;

    font-size:20px;

    box-shadow:
        0 5px 16px #168de255;

    transition:.2s;
}


.telegram-btn svg{

    width:20px;
    height:20px;

    display:block;

    fill:#ffffff;
}


.telegram-btn:hover{

    transform:scale(1.06);
}


/* =========================
   3 DOT BUTTON
========================= */

.menu-btn{

    width:36px;
    height:36px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:11px;

    background:#ffffff0b;

    border:1px solid #ffffff20;

    color:#fff;

    font-size:21px;

    cursor:pointer;

    transition:.2s;
}


.menu-btn:hover{

    background:#ffffff18;
}


/* =========================
   TITLE
========================= */

.title{

    margin-top:25px;

    font-size:28px;

    font-weight:800;
}


/* =========================
   SUBTITLE
========================= */

.subtitle{

    margin-top:7px;

    color:#aeb5c8;

    font-size:14px;
}


/* =========================
   APP GRID
========================= */

.game-grid{

    margin-top:26px;

    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,240px));

    gap:20px;

    justify-content:start;

    align-items:start;
}


/* =========================
   APP CARD
========================= */

.game-card{

    width:100%;

    padding:20px;

    border-radius:24px;

    background:

        linear-gradient(
            145deg,
            #ffffff14,
            #ffffff05
        );

    border:1px solid #ffffff18;

    cursor:pointer;

    transition:.25s;

    box-shadow:
        0 15px 40px #0005;
}


.game-card:hover{

    transform:translateY(-4px);

    border-color:#ffffff35;
}


/* =========================
   APP ICON
========================= */

.game-icon{

    width:82px;
    height:82px;

    display:flex;

    align-items:center;
    justify-content:center;

    margin-bottom:15px;

    border-radius:22px;

    font-size:48px;
}


/* =========================
   LUDO ICON
========================= */

.ludo-icon{

    background:
        linear-gradient(
            145deg,
            #ff4757,
            #ff9f43
        );

    box-shadow:
        0 12px 30px #ff475744;
}


/* =========================
   CHAT ICON
========================= */

.chat-icon{

    background:
        linear-gradient(
            145deg,
            #1677ff,
            #8b5cf6
        );

    box-shadow:
        0 12px 30px #1677ff44;
}


/* =========================
   CARD TITLE
========================= */

.game-card h2{

    font-size:19px;

    margin-bottom:7px;
}


/* =========================
   CARD DESCRIPTION
========================= */

.game-card p{

    color:#aeb5c8;

    font-size:13px;

    line-height:1.5;
}


/* =========================
   OPEN BUTTON
========================= */

.open-btn{

    margin-top:15px;

    width:100%;

    padding:10px;

    border:0;

    border-radius:12px;

    background:#ffffff12;

    color:#fff;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;
}


.open-btn:hover{

    background:#ffffff20;
}


/* =========================
   FULL SCREEN PAGE
========================= */

.fullPage{

    display:none;

    position:fixed;

    inset:0;

    width:100%;
    height:100%;

    background:#000;

    z-index:99999;
}


/* =========================
   IFRAME
========================= */

.fullFrame{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    border:0;

    display:block;

    background:#fff;
}


/* =========================
   MOBILE
========================= */

@media(max-width:520px){

    #mainDashboard{

        padding:14px;
    }


    .top-header-box{

        width:100%;

        height:54px;

        border-radius:15px;

        padding:0 8px 0 12px;
    }


    .top-header-box .logo{

        font-size:16px;
    }


    .developer-credit{

        font-size:10px;

        padding:3px 7px;
    }


    .telegram-btn,
    .menu-btn{

        width:32px;
        height:32px;

        font-size:17px;
    }


    .telegram-btn svg{

        width:18px;
        height:18px;
    }


    .title{

        margin-top:23px;

        font-size:26px;
    }


    .subtitle{

        font-size:13px;
    }


    .game-grid{

        grid-template-columns:
            repeat(2,minmax(0,1fr));

        gap:12px;
    }


    .game-card{

        padding:14px;

        border-radius:20px;
    }


    .game-icon{

        width:68px;
        height:68px;

        font-size:38px;

        border-radius:19px;
    }


    .game-card h2{

        font-size:16px;
    }


    .game-card p{

        font-size:12px;
    }


    .open-btn{

        font-size:11px;

        padding:9px;
    }
}


/* =========================
   VERY SMALL SCREEN
========================= */

@media(max-width:360px){

    .top-header-box .logo{

        font-size:14px;
    }


    .developer-credit{

        font-size:9px;

        padding:2px 6px;
    }


    .telegram-btn,
    .menu-btn{

        width:30px;
        height:30px;

        font-size:15px;
    }


    .telegram-btn svg{

        width:16px;
        height:16px;
    }


    .game-grid{

        gap:8px;
    }


    .game-card{

        padding:11px;
    }


    .game-card h2{

        font-size:14px;
    }


    .game-card p{

        font-size:11px;
    }
}

</style>

</head>


<body>


<!-- =========================
     MAIN DASHBOARD
========================= -->

<div id="mainDashboard">


    <!-- TOP HEADER BOX -->

    <div class="top-header-box">


        <!-- LEFT: LOGO + DEVELOPER CREDIT -->

        <div class="header-left">


            <!-- LOGO -->

            <div class="logo">

                ABK Game

            </div>


            <!-- DEVELOPER CREDIT -->

            <a
                class="developer-credit"
                href="https://t.me/ABKshanuBot"
                target="_blank"
                title="ABK Shanu Bot">

                ★ Developed: Shanu ★

            </a>


        </div>


        <!-- RIGHT: TELEGRAM + 3 DOT -->

        <div class="header-right">


            <!-- TELEGRAM (REAL ICON) -->

            <a
                class="telegram-btn"
                href="https://t.me/ABK_Official_Hub"
                target="_blank"
                title="ABK Official Hub">

                <svg
                    viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg">

                    <path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/>

                </svg>

            </a>


            <!-- 3 DOT -->

            <button
                class="menu-btn"
                onclick="showMenu()">

                ⋮

            </button>


        </div>

    </div>


    <!-- TITLE -->

    <div class="title">

        Multi App

    </div>


    <!-- SUBTITLE -->

    <div class="subtitle">

        Select an option to continue

    </div>


    <!-- =========================
         APP CARDS
    ========================= -->

    <div class="game-grid">


        <!-- LUDO -->

        <div
            class="game-card"
            onclick="openLudo()">


            <div class="game-icon ludo-icon">

                🎲

            </div>


            <h2>

                Ludo Game

            </h2>


            <p>

                Play Ludo with a smooth
                full-screen experience.

            </p>


            <button
                class="open-btn"
                type="button">

                OPEN LUDO →

            </button>


        </div>



        <!-- PRIVATE MEET -->

        <div
            class="game-card"
            onclick="openChat()">


            <div class="game-icon chat-icon">

                💬

            </div>


            <h2>

                Private Meet

            </h2>


            <p>

                Chat message, audio call
                and video call.

            </p>


            <button
                class="open-btn"
                type="button">

                OPEN MEET →

            </button>


        </div>


    </div>

</div>



<!-- =========================
     LUDO FULL PAGE
========================= -->

<div
    id="ludoDashboard"
    class="fullPage">


    <iframe
        id="ludoFrame"
        class="fullFrame"
        src="about:blank"
        title="ABK Ludo"
        allow="fullscreen; autoplay"
        allowfullscreen>

    </iframe>


</div>



<!-- =========================
     PRIVATE MEET FULL PAGE
========================= -->

<div
    id="chatDashboard"
    class="fullPage">


    <iframe
        id="chatFrame"
        class="fullFrame"
        src="about:blank"
        title="Private Meet"
        allow="camera; microphone; fullscreen"
        allowfullscreen>

    </iframe>


</div>



<script>

/* =========================
   LINKS
========================= */

const LUDO_URL =
    "https://shanu9534.github.io/ABK-Game/LudoGame.html";


const CHAT_TEST_URL =
    "https://shanu9534.github.io/ABK-Game/Privatemeet.html";



/* =========================
   OPEN LUDO
========================= */

function openLudo(){

    document
        .getElementById("mainDashboard")
        .style.display = "none";


    document
        .getElementById("ludoDashboard")
        .style.display = "block";


    document
        .getElementById("ludoFrame")
        .src = LUDO_URL;


    /* Push history state so mobile
       back button returns to dashboard
       instead of blank page */

    history.pushState(
        { view: "ludo" },
        "",
        "#ludo"
    );

}



/* =========================
   CLOSE LUDO
========================= */

function closeLudo(){

    document
        .getElementById("ludoFrame")
        .src = "about:blank";


    document
        .getElementById("ludoDashboard")
        .style.display = "none";


    document
        .getElementById("mainDashboard")
        .style.display = "block";

}



/* =========================
   OPEN MEET
========================= */

function openChat(){

    document
        .getElementById("mainDashboard")
        .style.display = "none";


    document
        .getElementById("chatDashboard")
        .style.display = "block";


    document
        .getElementById("chatFrame")
        .src = CHAT_TEST_URL;


    /* Push history state so mobile
       back button returns to dashboard
       instead of blank page */

    history.pushState(
        { view: "chat" },
        "",
        "#chat"
    );

}



/* =========================
   CLOSE MEET
========================= */

function closeChat(){

    document
        .getElementById("chatFrame")
        .src = "about:blank";


    document
        .getElementById("chatDashboard")
        .style.display = "none";


    document
        .getElementById("mainDashboard")
        .style.display = "block";

}



/* =========================
   HANDLE BACK BUTTON
   (mobile / browser back)
========================= */

window.addEventListener(

    "popstate",

    function(){


        /* If Ludo is open — close it and
           show dashboard */

        if(

            document
                .getElementById("ludoDashboard")
                .style.display === "block"

        ){

            closeLudo();

            return;

        }


        /* If Meet is open — close it and
           show dashboard */

        if(

            document
                .getElementById("chatDashboard")
                .style.display === "block"

        ){

            closeChat();

            return;

        }


        /* Otherwise, make sure dashboard is visible
           (never leave a blank screen) */

        document
            .getElementById("mainDashboard")
            .style.display = "block";

    }

);



/* =========================
   3 DOT MENU
========================= */

function showMenu(){

    alert(
        "ABK Game\n\n" +
        "Multi App Hub\n" +
        "More apps coming soon..."
    );

}

</script>


</body>
</html>
